[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ops-bridge-mcp"
version = "0.1.0"
description = "Production-grade MCP server unifying manufacturing/aviation operational telemetry, hybrid SOP knowledge retrieval, and idempotent ITSM action workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "sqlite-utils>=3.36",
    "rank-bm25>=0.2.2",
    "PyJWT>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src", "mock_itsm_api", "data", "console"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"
