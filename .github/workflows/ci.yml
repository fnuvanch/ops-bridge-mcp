name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Seed telemetry database
        run: python data/seed_db.py
      - name: Unit, RBAC, resilience, and console tests
        run: python -m pytest
      - name: Live MCP stdio + chaos drill
        run: python scripts/verify_live_stack.py
